name: Changelog — data de publicação

# O mintlify-docs só é mergeado depois do deploy dos outros serviços, então o dia do
# merge na main é a data de publicação. Este workflow troca os marcadores
# (xxxxxxxx_<slug>.mdx, date="xxxxxxxx" e tag: 'xxxx-xx-xx') por essa data e regenera
# as páginas de changelog. Em pull request, só confere que o trecho gerado das páginas
# não foi editado à mão.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checar-indice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Roda os testes do gerador do índice
        run: node --test 'scripts/changelog/*.test.mjs'

      - name: Confere o trecho gerado das páginas de changelog
        run: |
          node scripts/changelog/gerar-indice.mjs
          if ! git diff --exit-code -- pages/v2/changelog.mdx pages/v2/changelog-entregas.mdx; then
            echo "::error::O trecho entre os marcadores changelog:* é gerado. Não edite à mão: crie a entrada em snippets/changelog/<modalidade>/xxxxxxxx_<slug>.mdx."
            exit 1
          fi

  aplicar-datas:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Os secrets do GitHub App ficam no environment changelog, restrito à branch main, para
    # que um job de pull request não consiga ler a chave.
    environment: changelog
    concurrency:
      group: changelog-data
      cancel-in-progress: false
    steps:
      - name: Gera o token do GitHub App
        id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Calcula a data de publicação em São Paulo
        id: data
        run: echo "iso=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Aplica as datas, regenera as páginas e envia
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          CHANGELOG_DATA: ${{ steps.data.outputs.iso }}
        run: |
          usuario_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${usuario_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/changelog/gerar-indice.mjs --datas
            if [ -z "$(git status --porcelain -- snippets/changelog pages)" ]; then
              echo "Nenhum marcador encontrado e índice em dia; nada a commitar."
              exit 0
            fi
            if [ -n "$(git status --porcelain -- snippets/changelog)" ]; then
              mensagem="docs(changelog): aplica a data de publicação ${CHANGELOG_DATA}"
            else
              mensagem="docs(changelog): regenera o índice do changelog"
            fi
            git add -A -- snippets/changelog pages
            git commit -m "$mensagem"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
